name: Build and deploy admin frontend to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        working-directory: admin-frontend
        run: npm ci

      - name: Build
        working-directory: admin-frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Copy the static file server into dist/ so Oryx has a valid Node.js app
      # to start. Without this, Oryx cannot detect a Node.js version and fails.
      - name: Bundle server into dist
        working-directory: admin-frontend
        shell: bash
        run: |
          cp server.js dist/server.js
          cat > dist/package.json << 'EOF'
          {
            "name": "admin-frontend",
            "version": "1.0.0",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "express": "^4.19.0"
            }
          }
          EOF

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'scuba-admin'
          slot-name: 'Production'
          package: admin-frontend/dist
